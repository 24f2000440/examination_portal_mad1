{% extends "base.html" %}
{% block content %}
<a href="{{ url_for('examiner_dashboard') }}" class="btn btn-secondary btn-sm mb-3">&larr; Back</a>
<div class="card">
    <div class="card-header fw-bold">Evaluate Student: {{ booking.student.full_name }} ({{ booking.student.roll_number }})</div>
    <div class="card-body">
        <form method="POST">
            <table class="table table-bordered">
                <thead><tr><th>Rubric Criterion</th><th>Max Marks</th><th>Awarded Marks</th></tr></thead>
                <tbody>
                    {% for r in rubrics %}
                    <tr>
                        <td>{{ r.criterion_name }}</td>
                        <td>{{ r.max_marks }}</td>
                        <td>
                            <input type="number" step="0.5" min="0" max="{{ r.max_marks }}" name="rubric_{{ r.id }}" class="form-control" required>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            <div class="mb-3">
                <label class="form-label">Examiner Remarks / Feedback</label>
                <textarea name="remarks" class="form-control" rows="3" required>{{ booking.remarks or '' }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit Marks & Publish Result</button>
        </form>
    </div>
</div>
{% endblock %}
